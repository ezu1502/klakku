{% extends "base.html" %}

{% block title %}
    Register

{% block main %}
    <form method="post" class="message-form">

        <input type="password" name="password" placeholder="Password">
        <input type="password" name="confirm-password" placeholder="Confirm Password">
        <button type="submit">Register</button>
    </form>
{% endblock %}
