<!DOCTYPE html>

<html lang = "en">
    <head>
        <title>{% block title %}{% endblock %} - Klakku Messenger</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <script src="{{url_for('static', filename='logic.js')}}"></script>
    </head>

    <body>

        <nav class="klakku-nav">
            <a href="/" class="logo">Klakku</a>

            <div class="options">
                {% if session.get("user_id") %}
                    <a href="/">Account</a>
                    <a href="/logout">Log Out</a>
                {% else %}
                    <a href="/login">Login</a>
                    <a href="/register">Register</a>
                {% endif %}
            </div>
            
        </nav>

        <main>
            {% block main %}{% endblock %}
        </main>
    </body>
</html>
